# 危机资源配置（路线文档 §3.4 / §16.2）
#
# 硬约束：这些信息**绝不由模型生成**，只从本文件读取。
# 模型编造错误的求助电话，后果不可接受。
#
# 维护要求：
#   - 上线前必须由人工逐条核对号码有效性（§3.8 专家审计的一部分）
#   - 号码变更走配置发布，不需要改代码
#   - 启动自检会校验本文件存在且条目非空，缺失则拒绝启动（§13.2.2）

version: "2026-09-01"
last_verified: "2026-09-01"      # 人工核验日期，超过 180 天应告警

# 免责声明（§3.1 / 决策 #10：只在会话开始、报告显著位置、危机分支出现）
disclaimer: |
  本工具用于自我探索与思维梳理，不是医疗服务，不提供诊断或治疗。
  如你正处于痛苦之中，专业的人可以更好地帮到你 —— 下面是一些可以联系的渠道。

# 危机分支的开场语（温和、不评判、不追问）
crisis_message: |
  谢谢你愿意说出来。你刚才提到的内容让我有些担心，
  所以我想先停下提问 —— 现在更重要的是你能得到真正的支持。

